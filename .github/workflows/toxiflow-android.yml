name: ToxiFlow Android CI

# Independent of DocScan; run on demand for the branch being tested.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Android SDK 35
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Unit tests and debug APK
        working-directory: ToxiFlow
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ToxiFlow-debug-apk
          path: ToxiFlow/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      # Catch Android test compilation errors before booting an emulator. The
      # debug APK remains available even if this separate test compile fails.
      - name: Compile Android test APK
        working-directory: ToxiFlow
        run: ./gradlew assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToxiFlow-unit-test-report
          path: ToxiFlow/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 30

  device-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Ensure Android SDK 35
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test storage and transaction flow on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: cd ToxiFlow && ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Upload device test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToxiFlow-device-test-report
          path: ToxiFlow/app/build/reports/androidTests/connected/
          if-no-files-found: ignore
          retention-days: 30
