name: ToxiFlow Android CI

# Manual only: run this workflow from Actions when ready to validate a branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build app and run unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi

      - name: Assemble debug APK
        working-directory: ToxiFlow
        shell: bash
        run: |
          set +e
          ./gradlew assembleDebug --no-daemon --stacktrace --console=plain > "$RUNNER_TEMP/toxiflow-assemble.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/toxiflow-assemble.log"
          exit "$result"

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToxiFlow-debug-apk
          path: ToxiFlow/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 30

      - name: Run JVM unit tests
        working-directory: ToxiFlow
        shell: bash
        run: |
          set +e
          ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain > "$RUNNER_TEMP/toxiflow-unit-tests.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/toxiflow-unit-tests.log"
          exit "$result"

      - name: Summarize unit-test failures
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import os
          import xml.etree.ElementTree as ET

          files = glob.glob("ToxiFlow/app/build/test-results/testDebugUnitTest/**/*.xml", recursive=True)
          failures = []
          total = 0
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except (ET.ParseError, OSError):
                  continue
              for case in root.iter("testcase"):
                  total += 1
                  for result in list(case):
                      if result.tag in ("failure", "error"):
                          message = result.attrib.get("message", "").strip()
                          detail = (result.text or "").strip()
                          failures.append((case.attrib.get("classname", ""), case.attrib.get("name", "unknown"), message, detail))
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          with open(summary, "a", encoding="utf-8") as out:
              out.write(f"### ToxiFlow JVM tests: {total} test cases, {len(failures)} failures\n\n")
              for classname, name, message, detail in failures:
                  out.write(f"- **{classname}.{name}** — {message or 'failed'}\n")
                  if detail:
                      out.write(f"  ```text\n  {detail[:3000]}\n  ```\n")
          for classname, name, message, detail in failures:
              line = f"{classname}.{name}: {message or 'failed'}"
              print("::error::" + line.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          if not files:
              print("No JVM test XML reports were produced. Check the Gradle log artifact.")
          PY

      - name: Compile instrumentation tests
        working-directory: ToxiFlow
        shell: bash
        run: ./gradlew assembleDebugAndroidTest --no-daemon --stacktrace --console=plain

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToxiFlow-build-diagnostics
          path: |
            ${{ runner.temp }}/toxiflow-assemble.log
            ${{ runner.temp }}/toxiflow-unit-tests.log
            ToxiFlow/app/build/reports/tests/testDebugUnitTest/
            ToxiFlow/app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 30

  device-test:
    name: Run instrumentation tests on emulator
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK 35
        shell: bash
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          fi

      - name: Enable emulator acceleration
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            adb shell settings put system screen_off_timeout 1800000
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell input keyevent 82
            adb shell wm dismiss-keyguard || true
            cd ToxiFlow
            ./gradlew connectedDebugAndroidTest --no-daemon --stacktrace --console=plain > "$RUNNER_TEMP/toxiflow-device-tests.log" 2>&1
            result=$?
            cat "$RUNNER_TEMP/toxiflow-device-tests.log"
            exit "$result"

      - name: Summarize device-test failures
        if: always()
        run: python3 ToxiFlow/tools/report-device-test-failures.py

      - name: Upload device-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ToxiFlow-device-test-diagnostics
          path: |
            ${{ runner.temp }}/toxiflow-device-tests.log
            ToxiFlow/app/build/reports/androidTests/connected/
            ToxiFlow/app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 30
