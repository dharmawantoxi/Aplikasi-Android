name: Android CI

on:
  push:
    paths:
      - 'DocScanToxi/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'DocScanToxi/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        working-directory: DocScanToxi
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DocScanToxi-debug-apk
          path: DocScanToxi/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DocScanToxi-test-report
          path: DocScanToxi/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 30
